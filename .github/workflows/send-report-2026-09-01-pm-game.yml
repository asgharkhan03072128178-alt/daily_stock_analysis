name: Send 2026-09-01 18 A-share game recap

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/send-report-2026-09-01-pm-game.yml'

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
      REPORT_B64: 
    steps:
      - name: Send QQ SMTP report with retry
        shell: bash
        run: |
          python - <<'PY'
          import base64, os, smtplib, time
          from email.message import EmailMessage
          html = base64.b64decode(os.environ["REPORT_B64"])
          sender = os.environ["EMAIL_SENDER"].strip()
          password = os.environ["EMAIL_PASSWORD"].strip()
          receivers = [x.strip() for x in os.environ["EMAIL_RECEIVERS"].replace(";", ",").split(",") if x.strip()]
          if not sender or not password or not receivers:
              raise RuntimeError("email secrets are incomplete")
          msg = EmailMessage()
          msg["Subject"] = "2026-09-01 18:00 A股预测学习游戏 Day 2 收盘复盘（补发）"
          msg["From"] = sender
          msg["To"] = ", ".join(receivers)
          msg.set_content("请使用支持HTML的邮件客户端查看Day 2收盘复盘。")
          msg.add_alternative(html.decode("utf-8"), subtype="html")
          msg.add_attachment(html, maintype="text", subtype="html", filename="2026-09-01_A股预测学习Day2复盘.html")
          errors = []
          for attempt in range(1, 5):
              try:
                  if attempt % 2:
                      with smtplib.SMTP_SSL("smtp.qq.com", 465, timeout=25) as smtp:
                          smtp.login(sender, password)
                          smtp.send_message(msg)
                  else:
                      with smtplib.SMTP("smtp.qq.com", 587, timeout=25) as smtp:
                          smtp.ehlo(); smtp.starttls(); smtp.ehlo()
                          smtp.login(sender, password); smtp.send_message(msg)
                  print("sent", attempt)
                  break
              except Exception as exc:
                  errors.append(f"{type(exc).__name__}: {exc}")
                  if attempt < 4: time.sleep(5 * attempt)
          else:
              raise RuntimeError("all SMTP attempts failed: " + " | ".join(errors))
          PY
