name: 发送2026-08-23 18点周末策略报告

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/send-report-2026-08-23-pm.yml

permissions:
  contents: read

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
      REPORT_B64: ""

    steps:
      - name: 检查邮件配置
        shell: bash
        run: |
          test -n "$EMAIL_SENDER" || { echo "缺少 EMAIL_SENDER"; exit 1; }
          test -n "$EMAIL_PASSWORD" || { echo "缺少 EMAIL_PASSWORD"; exit 1; }
          test -n "$EMAIL_RECEIVERS" || { echo "缺少 EMAIL_RECEIVERS"; exit 1; }

      - name: 发送周末策略报告
        shell: python
        run: |
          import base64
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          sender = os.environ["EMAIL_SENDER"].strip()
          password = os.environ["EMAIL_PASSWORD"].strip()
          receivers = [x.strip() for x in os.environ["EMAIL_RECEIVERS"].split(",") if x.strip()]
          if not receivers:
              raise RuntimeError("EMAIL_RECEIVERS 中没有有效收件地址")
          html = base64.b64decode(os.environ["REPORT_B64"])
          msg = EmailMessage()
          msg["From"] = sender
          msg["To"] = ", ".join(receivers)
          msg["Subject"] = "2026-08-23 18点周末策略｜下周三情景与模拟条件单"
          msg.set_content("本邮件包含HTML版下周策略报告，请使用支持HTML的邮件客户端查看。")
          msg.add_alternative(html.decode("utf-8"), subtype="html")
          msg.add_attachment(html, maintype="text", subtype="html", filename="2026-08-23_18点周末学习_下周三情景策略.html")
          context = ssl.create_default_context()
          with smtplib.SMTP_SSL("smtp.qq.com", 465, context=context, timeout=30) as smtp:
              smtp.login(sender, password)
              smtp.send_message(msg)
          print("2026-08-23 18点周末策略报告发送成功")
