name: 发送2026-08-20 A股收盘复盘

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/send-report-2026-08-20.yml

permissions:
  contents: read

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
      REPORT_HTML_B64: ""

    steps:
      - name: 发送收盘复盘报告
        shell: python
        run: |
          import base64
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          sender = os.environ["EMAIL_SENDER"].strip()
          password = os.environ["EMAIL_PASSWORD"].strip()
          receivers = [x.strip() for x in os.environ["EMAIL_RECEIVERS"].split(",") if x.strip()]
          if not sender or not password or not receivers:
              raise RuntimeError("邮件Secret配置不完整")

          html_bytes = base64.b64decode(os.environ["REPORT_HTML_B64"])
          html = html_bytes.decode("utf-8")

          message = EmailMessage()
          message["From"] = sender
          message["To"] = ", ".join(receivers)
          message["Subject"] = "2026-08-20 A股收盘复盘与模拟账户报告"
          message.set_content(
              "今日复盘报告已生成。核心结论：指数收红但结构分化，"
              "医药医疗短线加速不追涨；模拟账户保持100,500元现金，"
              "下一交易日仅保留510300小仓条件买入计划。"
              "\n\n完整图文报告见附件。"
          )
          message.add_alternative(html, subtype="html")
          message.add_attachment(
              html_bytes,
              maintype="text",
              subtype="html",
              filename="2026-08-20_A股收盘复盘报告.html",
          )

          with smtplib.SMTP_SSL(
              "smtp.qq.com",
              465,
              context=ssl.create_default_context(),
              timeout=30,
          ) as smtp:
              smtp.login(sender, password)
              smtp.send_message(message)

          print("2026-08-20 A股收盘复盘报告发送成功")
