name: 发送2026-08-21 A股盘前前瞻

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/send-report-2026-08-21-am.yml

permissions:
  contents: read

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
      REPORT_HTML_B64: ""
    steps:
      - name: 发送盘前前瞻
        shell: python
        run: |
          import base64, os, smtplib, ssl
          from email.message import EmailMessage
          sender=os.environ["EMAIL_SENDER"].strip()
          password=os.environ["EMAIL_PASSWORD"].strip()
          receivers=[x.strip() for x in os.environ["EMAIL_RECEIVERS"].split(",") if x.strip()]
          if not sender or not password or not receivers:
              raise RuntimeError("邮件Secret配置不完整")
          html_bytes=base64.b64decode(os.environ["REPORT_HTML_B64"])
          html=html_bytes.decode("utf-8")
          message=EmailMessage()
          message["From"]=sender
          message["To"]=", ".join(receivers)
          message["Subject"]="2026-08-21 A股盘前前瞻与模拟账户计划"
          message.set_content("盘前前瞻已生成：隔夜海外风险升温，今日不开盘抢买；仅保留510300一笔条件计划，完整报告见附件。")
          message.add_alternative(html, subtype="html")
          message.add_attachment(html_bytes, maintype="text", subtype="html", filename="2026-08-21_A股盘前前瞻.html")
          with smtplib.SMTP_SSL("smtp.qq.com",465,context=ssl.create_default_context(),timeout=30) as smtp:
              smtp.login(sender,password)
              smtp.send_message(message)
          print("2026-08-21 A股盘前前瞻发送成功")
