name: 发送2026-08-22 08点周末学习报告
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/send-report-2026-08-22-am.yml]
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
      REPORT_HTML_B64: ""
    steps:
      - shell: python
        run: |
          import base64,os,smtplib,ssl
          from email.message import EmailMessage
          sender=os.environ["EMAIL_SENDER"].strip(); password=os.environ["EMAIL_PASSWORD"].strip()
          receivers=[x.strip() for x in os.environ["EMAIL_RECEIVERS"].split(",") if x.strip()]
          if not sender or not password or not receivers: raise RuntimeError("邮件Secret配置不完整")
          raw=base64.b64decode(os.environ["REPORT_HTML_B64"]); html=raw.decode("utf-8")
          e=EmailMessage(); e["From"]=sender; e["To"]=", ".join(receivers); e["Subject"]="周末学习①：A股制度、微观结构与10%回撤风控"
          e.set_content("本次学习重点：T+1、涨跌幅、交易费用、ETF机制、指标误区和适合初学者的风控框架。核心结论：先避免大错，再追求收益。完整报告见附件。")
          e.add_alternative(html,subtype="html"); e.add_attachment(raw,maintype="text",subtype="html",filename="2026-08-22_周末学习_A股制度与风控.html")
          with smtplib.SMTP_SSL("smtp.qq.com",465,context=ssl.create_default_context(),timeout=30) as x:
              x.login(sender,password); x.send_message(e)
          print("周末学习报告发送成功")
