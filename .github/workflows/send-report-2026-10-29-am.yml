name: Send 2026-10-29 A-share premarket research
on:
  workflow_dispatch:
  push:
    paths:
      - 'daily_reports/2026-10-29_08点A股盘前预测.html'
      - '.github/workflows/send-report-2026-10-29-am.yml'
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Send QQ SMTP research email
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
        run: |
          python - <<'PY'
          import os, smtplib
          from email.message import EmailMessage
          path='daily_reports/2026-10-29_08点A股盘前预测.html'
          html=open(path,encoding='utf-8').read()
          sender=os.environ['EMAIL_SENDER'].strip(); password=os.environ['EMAIL_PASSWORD'].strip()
          recipients=[x.strip() for x in os.environ['EMAIL_RECEIVERS'].replace(';',',').split(',') if x.strip()]
          if not (sender and password and recipients): raise RuntimeError('QQ SMTP secrets incomplete')
          msg=EmailMessage(); msg['Subject']='2026-10-29 A股预测学习游戏08点盘前研究：30只样本与跨资产观察'
          msg['From']=sender; msg['To']=', '.join(recipients)
          msg.set_content('附件为2026-10-29 A股盘前研究HTML。模拟买入计划0只；样本和数据缺口详见报告。')
          msg.add_alternative(html,subtype='html')
          msg.add_attachment(html.encode('utf-8'),maintype='text',subtype='html',filename='2026-10-29_08点A股盘前预测.html')
          with smtplib.SMTP_SSL('smtp.qq.com',465,timeout=30) as smtp:
              smtp.login(sender,password); smtp.send_message(msg)
          print('QQ SMTP send succeeded')
          PY
