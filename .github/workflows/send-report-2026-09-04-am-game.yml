name: Send 2026-09-04 AM A-share game report

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/send-report-2026-09-04-am-game.yml'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTML report by QQ SMTP
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
          REPORT_B64: 
        run: |
          python - <<'PY'
          import os, base64, smtplib, ssl, time
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from email.mime.application import MIMEApplication
          sender = os.environ["EMAIL_SENDER"].strip()
          password = os.environ["EMAIL_PASSWORD"].strip()
          receivers = [x.strip() for x in os.environ["EMAIL_RECEIVERS"].replace(";", ",").split(",") if x.strip()]
          html = base64.b64decode(os.environ["REPORT_B64"]).decode("utf-8")
          subject = "2026-09-04 08:00 A股预测学习游戏 Day 5｜30股盘前预测"
          msg = MIMEMultipart()
          msg["From"] = sender
          msg["To"] = ", ".join(receivers)
          msg["Subject"] = subject
          msg.attach(MIMEText(html, "html", "utf-8"))
          attachment = MIMEApplication(html.encode("utf-8"), _subtype="html")
          attachment.add_header("Content-Disposition", "attachment", filename=("utf-8", "", "2026-09-04_08点A股30股预测学习报告.html"))
          msg.attach(attachment)
          last = None
          for attempt in range(3):
              try:
                  with smtplib.SMTP_SSL("smtp.qq.com", 465, context=ssl.create_default_context(), timeout=30) as s:
                      s.login(sender, password)
                      s.sendmail(sender, receivers, msg.as_string())
                  print("MAIL_SENT", len(receivers))
                  break
              except Exception as e:
                  last = e
                  print("SMTP465_RETRY", attempt + 1, type(e).__name__)
                  time.sleep(5)
          else:
              try:
                  with smtplib.SMTP("smtp.qq.com", 587, timeout=30) as s:
                      s.ehlo(); s.starttls(context=ssl.create_default_context()); s.ehlo()
                      s.login(sender, password)
                      s.sendmail(sender, receivers, msg.as_string())
                  print("MAIL_SENT_STARTTLS", len(receivers))
              except Exception:
                  raise last
          PY
