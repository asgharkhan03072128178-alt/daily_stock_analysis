name: Send 2026-08-25 08 A-share premarket report

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/send-report-2026-08-25-am.yml'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send QQ SMTP report
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
          REPORT_B64: 
        run: |
          python - <<'PY'
          import os, base64, smtplib
          from email.message import EmailMessage
          html = base64.b64decode(os.environ['REPORT_B64']).decode('utf-8')
          sender = os.environ['EMAIL_SENDER'].strip()
          receivers = [x.strip() for x in os.environ['EMAIL_RECEIVERS'].replace(';', ',').split(',') if x.strip()]
          msg = EmailMessage()
          msg['Subject'] = '2026-08-25 08:00 A股盘前前瞻｜仅1笔沪深300ETF条件计划'
          msg['From'] = sender
          msg['To'] = ', '.join(receivers)
          msg.set_content('请使用支持HTML的邮件客户端查看盘前报告。')
          msg.add_alternative(html, subtype='html')
          msg.add_attachment(html.encode('utf-8'), maintype='text', subtype='html', filename='2026-08-25_08_A股盘前前瞻.html')
          with smtplib.SMTP_SSL('smtp.qq.com', 465, timeout=30) as smtp:
              smtp.login(sender, os.environ['EMAIL_PASSWORD'].strip())
              smtp.send_message(msg)
          print('sent to', len(receivers), 'receiver(s)')
          PY
