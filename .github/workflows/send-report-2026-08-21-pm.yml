name: 发送2026-08-21 A股收盘复盘
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/send-report-2026-08-21-pm.yml
permissions:
  contents: read
jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
      REPORT_HTML_B64: ""
    steps:
      - name: 发送收盘复盘
        shell: python
        run: |
          import base64,os,smtplib,ssl
          from email.message import EmailMessage
          sender=os.environ["EMAIL_SENDER"].strip()
          password=os.environ["EMAIL_PASSWORD"].strip()
          receivers=[x.strip() for x in os.environ["EMAIL_RECEIVERS"].split(",") if x.strip()]
          if not sender or not password or not receivers: raise RuntimeError("邮件Secret配置不完整")
          raw=base64.b64decode(os.environ["REPORT_HTML_B64"]); html=raw.decode("utf-8")
          m=EmailMessage(); m["From"]=sender; m["To"]=", ".join(receivers); m["Subject"]="2026-08-21 A股收盘复盘与模拟账户报告"
          m.set_content("今日复盘：创业板走强但成交缩量；盘前510300条件未完全满足，模拟账户保持101,000元现金。完整报告见附件。")
          m.add_alternative(html,subtype="html")
          m.add_attachment(raw,maintype="text",subtype="html",filename="2026-08-21_A股收盘复盘.html")
          with smtplib.SMTP_SSL("smtp.qq.com",465,context=ssl.create_default_context(),timeout=30) as smtp:
              smtp.login(sender,password); smtp.send_message(m)
          print("2026-08-21 A股收盘复盘发送成功")
