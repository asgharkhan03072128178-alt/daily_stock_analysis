name: Send 2026-10-04 holiday close review
on:
  push:
    paths:
      - 'daily_reports/2026-10-04_18点休市资讯复盘.html'
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Send QQ SMTP holiday review
        shell: bash
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
        run: |
          python - <<'PY'
          import os, smtplib, time
          from email.message import EmailMessage
          path = "daily_reports/2026-10-04_18点休市资讯复盘.html"
          html = open(path, "rb").read()
          sender = os.environ["EMAIL_SENDER"].strip()
          password = os.environ["EMAIL_PASSWORD"].strip()
          receivers = [x.strip() for x in os.environ["EMAIL_RECEIVERS"].replace(";", ",").split(",") if x.strip()]
          if not sender or not password or not receivers:
              raise RuntimeError("email secrets are incomplete")
          msg = EmailMessage()
          msg["Subject"] = "2026-10-04 休市复盘：客流高位、油价缓和，节后框架不变"
          msg["From"] = sender
          msg["To"] = ", ".join(receivers)
          msg.set_content("国庆休市资讯复盘已完成。铁路客流保持高位，但盈利数据仍待验证；G7释放油品储备缓和油价，节后基础情景暂不调整。")
          msg.add_alternative(html.decode("utf-8"), subtype="html")
          msg.add_attachment(html, maintype="text", subtype="html", filename="2026-10-04_18点休市资讯复盘.html")
          errors = []
          for attempt in range(1, 5):
              try:
                  if attempt % 2:
                      with smtplib.SMTP_SSL("smtp.qq.com", 465, timeout=25) as smtp:
                          smtp.login(sender, password); smtp.send_message(msg)
                  else:
                      with smtplib.SMTP("smtp.qq.com", 587, timeout=25) as smtp:
                          smtp.ehlo(); smtp.starttls(); smtp.ehlo(); smtp.login(sender, password); smtp.send_message(msg)
                  print("sent", attempt)
                  break
              except Exception as exc:
                  errors.append(f"{type(exc).__name__}: {exc}")
                  if attempt < 4:
                      time.sleep(5 * attempt)
          else:
              raise RuntimeError("all SMTP attempts failed: " + " | ".join(errors))
          PY
