name: Send 2026-10-05 holiday study
on:
  push:
    paths:
      - 'daily_reports/2026-10-05_08点休市专题学习.html'
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Send QQ SMTP holiday study
        shell: bash
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
        run: |
          python - <<'PY'
          import os, smtplib, time
          from email.message import EmailMessage
          path = "daily_reports/2026-10-05_08点休市专题学习.html"
          html = open(path, "rb").read()
          sender = os.environ["EMAIL_SENDER"].strip()
          password = os.environ["EMAIL_PASSWORD"].strip()
          receivers = [x.strip() for x in os.environ["EMAIL_RECEIVERS"].replace(";", ",").split(",") if x.strip()]
          if not sender or not password or not receivers:
              raise RuntimeError("email secrets are incomplete")
          msg = EmailMessage()
          msg["Subject"] = "2026-10-05 休市学习：客流为什么不等于股票利润"
          msg["From"] = sender
          msg["To"] = ", ".join(receivers)
          msg.set_content("今日休市专题研究已完成：用客流、客单价、收入转化、成本和估值五层漏斗判断消费股，避免把假日热度直接当作买入信号。")
          msg.add_alternative(html.decode("utf-8"), subtype="html")
          msg.add_attachment(html, maintype="text", subtype="html", filename="2026-10-05_08点休市专题学习.html")
          errors = []
          for attempt in range(1, 5):
              try:
                  if attempt % 2:
                      with smtplib.SMTP_SSL("smtp.qq.com", 465, timeout=25) as smtp:
                          smtp.login(sender, password); smtp.send_message(msg)
                  else:
                      with smtplib.SMTP("smtp.qq.com", 587, timeout=25) as smtp:
                          smtp.ehlo(); smtp.starttls(); smtp.ehlo(); smtp.login(sender, password); smtp.send_message(msg)
                  print("sent", attempt)
                  break
              except Exception as exc:
                  errors.append(f"{type(exc).__name__}: {exc}")
                  if attempt < 4: time.sleep(5 * attempt)
          else:
              raise RuntimeError("all SMTP attempts failed: " + " | ".join(errors))
          PY
