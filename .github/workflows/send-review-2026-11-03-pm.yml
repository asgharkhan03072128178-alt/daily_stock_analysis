name: Send 2026-11-03 A-share closing review
on:
  workflow_dispatch:
  push:
    paths:
      - 'daily_reports/2026-11-03_18点A股复盘与纠错.html'
      - '.github/workflows/send-review-2026-11-03-pm.yml'
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Send QQ SMTP closing review
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
        run: |
          python - <<'PY'
          import os, smtplib
          from email.message import EmailMessage
          path='daily_reports/2026-11-03_18点A股复盘与纠错.html'
          html=open(path,encoding='utf-8').read()
          sender=os.environ.get('EMAIL_SENDER','').strip()
          password=os.environ.get('EMAIL_PASSWORD','').strip()
          recipients=[x.strip() for x in os.environ.get('EMAIL_RECEIVERS','').replace(';',',').split(',') if x.strip()]
          if not (sender and password and recipients): raise RuntimeError('QQ SMTP secrets incomplete')
          msg=EmailMessage()
          msg['Subject']='2026-11-03 A股预测学习游戏18点收盘复盘与纠错'
          msg['From']=sender; msg['To']=', '.join(recipients)
          msg.set_content('附件为11月3日A股收盘复盘，包含30股预测复核、26个采样时点、重点股轨迹、模拟账户及数据缺口。')
          msg.add_alternative(html,subtype='html')
          msg.add_attachment(html.encode('utf-8'),maintype='text',subtype='html',filename='2026-11-03_18点A股复盘与纠错.html')
          with smtplib.SMTP_SSL('smtp.qq.com',465,timeout=30) as smtp:
              smtp.login(sender,password); smtp.send_message(msg)
          print('QQ SMTP send succeeded')
          PY
