name: Send 2026-09-13 A-share Sunday outlook

on:
  workflow_dispatch:
  push:
    paths:
      - 'daily_reports/2026-09-13_周日前瞻.html'
      - '.github/workflows/send-report-2026-09-13-am.yml'

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Send QQ SMTP report with retry
        shell: bash
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
        run: |
          python - <<'PY'
          import os, smtplib, time
          from email.message import EmailMessage
          path="daily_reports/2026-09-13_周日前瞻.html"; html=open(path,"rb").read()
          sender=os.environ["EMAIL_SENDER"].strip(); password=os.environ["EMAIL_PASSWORD"].strip()
          receivers=[x.strip() for x in os.environ["EMAIL_RECEIVERS"].replace(";",",").split(",") if x.strip()]
          if not sender or not password or not receivers: raise RuntimeError("email secrets are incomplete")
          msg=EmailMessage(); msg["Subject"]="2026-09-13 A股周日前瞻：先识别能源冲击，再谈行业机会"; msg["From"]=sender; msg["To"] = ", ".join(receivers)
          msg.set_content("请使用支持HTML的邮件客户端查看周日前瞻。")
          msg.add_alternative(html.decode("utf-8"),subtype="html")
          msg.add_attachment(html,maintype="text",subtype="html",filename="2026-09-13_A股周日前瞻.html")
          errors=[]
          for attempt in range(1,5):
              try:
                  if attempt%2:
                      with smtplib.SMTP_SSL("smtp.qq.com",465,timeout=25) as smtp: smtp.login(sender,password); smtp.send_message(msg)
                  else:
                      with smtplib.SMTP("smtp.qq.com",587,timeout=25) as smtp: smtp.ehlo(); smtp.starttls(); smtp.ehlo(); smtp.login(sender,password); smtp.send_message(msg)
                  print("sent",attempt); break
              except Exception as exc:
                  errors.append(f"{type(exc).__name__}: {exc}")
                  if attempt<4: time.sleep(5*attempt)
          else: raise RuntimeError("all SMTP attempts failed: "+" | ".join(errors))
          PY
