name: Send 2026-09-04 PM A-share game recap

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/send-report-2026-09-04-pm-game.yml'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTML report by QQ SMTP
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
          REPORT_B64: 
        run: |
          python - <<'PY'
          import os, base64, smtplib, ssl, time
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from email.mime.application import MIMEApplication
          sender=os.environ["EMAIL_SENDER"].strip()
          password=os.environ["EMAIL_PASSWORD"].strip()
          receivers=[x.strip() for x in os.environ["EMAIL_RECEIVERS"].replace(";",",").split(",") if x.strip()]
          html=base64.b64decode(os.environ["REPORT_B64"]).decode("utf-8")
          msg=MIMEMultipart()
          msg["From"]=sender
          msg["To"]=", ".join(receivers)
          msg["Subject"]="2026-09-04 18:00 A股预测学习复盘｜首周模型体检"
          msg.attach(MIMEText(html,"html","utf-8"))
          part=MIMEApplication(html.encode("utf-8"),_subtype="html")
          part.add_header("Content-Disposition","attachment",filename=("utf-8","","2026-09-04_18点A股预测学习复盘暨首周模型体检.html"))
          msg.attach(part)
          errors=[]
          for attempt in range(4):
              try:
                  if attempt % 2 == 0:
                      with smtplib.SMTP_SSL("smtp.qq.com",465,context=ssl.create_default_context(),timeout=40) as s:
                          s.login(sender,password); s.sendmail(sender,receivers,msg.as_string())
                  else:
                      with smtplib.SMTP("smtp.qq.com",587,timeout=40) as s:
                          s.ehlo(); s.starttls(context=ssl.create_default_context()); s.ehlo()
                          s.login(sender,password); s.sendmail(sender,receivers,msg.as_string())
                  print("MAIL_SENT",len(receivers),"attempt",attempt+1)
                  break
              except Exception as e:
                  errors.append(f"{type(e).__name__}: {e}")
                  print("SMTP_RETRY",attempt+1,type(e).__name__)
                  time.sleep(5*(attempt+1))
          else:
              raise RuntimeError(" | ".join(errors))
          PY
