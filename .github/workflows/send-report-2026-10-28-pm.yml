name: Send 2026-10-28 A-share evening review
on:
  workflow_dispatch:
  push:
    paths:
      - 'daily_reports/2026-10-28_18点A股数据缺口复盘.html'
      - '.github/workflows/send-report-2026-10-28-pm.yml'
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Send QQ SMTP review email
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
        run: |
          python - <<'PY'
          import os, smtplib
          from email.message import EmailMessage
          path='daily_reports/2026-10-28_18点A股数据缺口复盘.html'
          html=open(path,encoding='utf-8').read()
          sender=os.environ['EMAIL_SENDER'].strip(); password=os.environ['EMAIL_PASSWORD'].strip()
          recipients=[x.strip() for x in os.environ['EMAIL_RECEIVERS'].replace(';',',').split(',') if x.strip()]
          if not (sender and password and recipients): raise RuntimeError('QQ SMTP secrets incomplete')
          m=EmailMessage(); m['Subject']='2026-10-28 A股预测学习游戏18点复盘：盘中数据缺失，预测不计分'
          m['From']=sender; m['To']=', '.join(recipients)
          m.set_content('10月28日复盘：盘前名单日期未更新，缺少今日盘中数据；未补造预测或成交。')
          m.add_alternative(html,subtype='html')
          m.add_attachment(html.encode('utf-8'),maintype='text',subtype='html',filename='2026-10-28_18点A股数据缺口复盘.html')
          with smtplib.SMTP_SSL('smtp.qq.com',465,timeout=30) as smtp: smtp.login(sender,password); smtp.send_message(m)
          print('QQ SMTP send succeeded')
          PY
