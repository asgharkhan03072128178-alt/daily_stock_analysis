name: 发送2026-08-24 18点A股收盘复盘

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/send-report-2026-08-24-pm.yml

permissions:
  contents: read

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
      EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
      REPORT_B64: ""

    steps:
      - name: 检查邮件配置
        shell: bash
        run: |
          test -n "$EMAIL_SENDER" || { echo "缺少 EMAIL_SENDER"; exit 1; }
          test -n "$EMAIL_PASSWORD" || { echo "缺少 EMAIL_PASSWORD"; exit 1; }
          test -n "$EMAIL_RECEIVERS" || { echo "缺少 EMAIL_RECEIVERS"; exit 1; }

      - name: 发送收盘复盘
        shell: python
        run: |
          import base64, os, smtplib, ssl
          from email.message import EmailMessage
          sender = os.environ["EMAIL_SENDER"].strip()
          password = os.environ["EMAIL_PASSWORD"].strip()
          receivers = [x.strip() for x in os.environ["EMAIL_RECEIVERS"].split(",") if x.strip()]
          if not receivers:
              raise RuntimeError("EMAIL_RECEIVERS 中没有有效收件地址")
          html = base64.b64decode(os.environ["REPORT_B64"])
          msg = EmailMessage()
          msg["From"] = sender
          msg["To"] = ", ".join(receivers)
          msg["Subject"] = "2026-08-24 18点A股复盘｜放量普跌，模拟0交易"
          msg.set_content("本邮件包含HTML版A股收盘复盘，请使用支持HTML的邮件客户端查看。")
          msg.add_alternative(html.decode("utf-8"), subtype="html")
          msg.add_attachment(html, maintype="text", subtype="html", filename="2026-08-24_18点A股收盘复盘.html")
          with smtplib.SMTP_SSL("smtp.qq.com", 465, context=ssl.create_default_context(), timeout=30) as smtp:
              smtp.login(sender, password)
              smtp.send_message(msg)
          print("2026-08-24 18点A股收盘复盘发送成功")
