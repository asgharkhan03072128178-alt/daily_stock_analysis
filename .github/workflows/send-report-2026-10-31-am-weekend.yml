name: Send 2026-10-31 A-share weekend rates outlook
on:
  workflow_dispatch:
  push:
    paths:
      - 'daily_reports/2026-10-31_08点周末利率与跨资产前瞻.html'
      - '.github/workflows/send-report-2026-10-31-am-weekend.yml'
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Send QQ SMTP weekend research email
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
        run: |
          python - <<'PY'
          import os, smtplib
          from email.message import EmailMessage
          path='daily_reports/2026-10-31_08点周末利率与跨资产前瞻.html'
          html=open(path,encoding='utf-8').read()
          sender=os.environ.get('EMAIL_SENDER','').strip()
          password=os.environ.get('EMAIL_PASSWORD','').strip()
          recipients=[x.strip() for x in os.environ.get('EMAIL_RECEIVERS','').replace(';',',').split(',') if x.strip()]
          if not (sender and password and recipients): raise RuntimeError('QQ SMTP secrets incomplete')
          msg=EmailMessage()
          msg['Subject']='2026-10-31 A股预测学习游戏08点周末研究：全球利率与跨资产传导'
          msg['From']=sender; msg['To']=', '.join(recipients)
          msg.set_content('附件为周末利率与跨资产学习前瞻。本日非交易日，不含30股预测榜单、watchlist更新或模拟成交。')
          msg.add_alternative(html,subtype='html')
          msg.add_attachment(html.encode('utf-8'),maintype='text',subtype='html',filename='2026-10-31_08点周末利率与跨资产前瞻.html')
          with smtplib.SMTP_SSL('smtp.qq.com',465,timeout=30) as smtp:
              smtp.login(sender,password); smtp.send_message(msg)
          print('QQ SMTP send succeeded')
          PY
