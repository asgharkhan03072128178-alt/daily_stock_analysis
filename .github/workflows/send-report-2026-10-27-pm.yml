name: Send 2026-10-27 A-share evening research
on:
  workflow_dispatch:
  push:
    paths:
      - 'daily_reports/2026-10-27_18点A股复盘.html'
      - '.github/workflows/send-report-2026-10-27-pm.yml'
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Send QQ SMTP research email
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVERS: ${{ secrets.EMAIL_RECEIVERS }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.message import EmailMessage

          path = 'daily_reports/2026-10-27_18点A股复盘.html'
          html = open(path, encoding='utf-8').read()
          sender = os.environ['EMAIL_SENDER'].strip()
          password = os.environ['EMAIL_PASSWORD'].strip()
          recipients = [x.strip() for x in os.environ['EMAIL_RECEIVERS'].replace(';', ',').split(',') if x.strip()]
          if not (sender and password and recipients):
              raise RuntimeError('QQ SMTP secrets incomplete')
          message = EmailMessage()
          message['Subject'] = '2026-10-27 A股预测学习游戏18点复盘：方向12/30，模拟新交易0笔'
          message['From'] = sender
          message['To'] = ', '.join(recipients)
          message.set_content('10月27日复盘：30只研究样本，方向命中12/30，模拟新交易0笔；不构成投资建议。')
          message.add_alternative(html, subtype='html')
          message.add_attachment(html.encode('utf-8'), maintype='text', subtype='html', filename='2026-10-27_18点A股复盘.html')
          with smtplib.SMTP_SSL('smtp.qq.com', 465, timeout=30) as smtp:
              smtp.login(sender, password)
              smtp.send_message(message)
          print('QQ SMTP send succeeded')
          PY
